name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Contenedor efímero de CI, sin datos reales: esta clave no protege nada fuera del job.
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://turnos_app:turnos-app-ci@localhost:5432/turnos
      DATABASE_URL_MIGRACIONES: postgres://postgres:postgres-ci@localhost:5432/turnos
      DATABASE_URL_TEST: postgres://turnos_app:turnos-app-ci@localhost:5432/turnos_test
      DATABASE_URL_TEST_MIGRACIONES: postgres://postgres:postgres-ci@localhost:5432/turnos_test

    steps:
      - uses: actions/checkout@v4

      # Toma la versión de pnpm del campo packageManager de package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm db:migrate
      - run: pnpm test:integration
